name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'server/**'
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/build-mac.yml'

jobs:
  build-mac:
    name: Build & Package macOS DMG (Apple Silicon & Intel)
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application and server
        run: npm run build

      - name: Package macOS DMG (Apple Silicon arm64 & Intel x64)
        run: npx electron-builder --mac dmg --arm64 --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bilight-macOS-DMG
          path: releases/*.dmg

      - name: Attach DMG to GitHub Release
        run: |
          if gh release view v0.1.4 >/dev/null 2>&1; then
            gh release upload v0.1.4 releases/*.dmg --clobber
          elif gh release view v0.1.4-windows >/dev/null 2>&1; then
            gh release upload v0.1.4-windows releases/*.dmg --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
